<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapClip — Demo Video (Shipaton 2026 Submission)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
          colors: {
            brand: { 500: '#6C63FF', 600: '#574edf' },
            accent: '#FF6584'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0F0F1A] text-[#E8E8FF] font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

  <!-- Header Branding -->
  <div class="max-w-4xl w-full flex items-center justify-between mb-6">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-accent flex items-center justify-center text-white text-xl shadow-lg shadow-brand-500/30">
        📋
      </div>
      <div>
        <h1 class="font-bold text-xl text-white tracking-tight">SnapClip — Demo Video</h1>
        <p class="text-xs text-gray-400">RevenueCat Shipaton 2026 • Next Gen Award</p>
      </div>
    </div>
    <a 
      href="/" 
      class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-semibold shadow-md transition-all flex items-center space-x-1.5"
    >
      <span>Open Live App</span>
      <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
    </a>
  </div>

  <!-- Video Container -->
  <div class="max-w-4xl w-full bg-[#1A1A2E] rounded-3xl p-3 sm:p-4 shadow-2xl border border-[#252540] overflow-hidden">
    <div class="relative rounded-2xl overflow-hidden bg-black aspect-video flex items-center justify-center shadow-inner">
      <video 
        controls 
        autoplay 
        playsinline
        class="w-full h-full object-contain"
        poster="/logo.jpg"
      >
        <source src="/demo.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </div>

    <!-- Video Metadata & Quick Links -->
    <div class="p-4 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-t border-[#252540] mt-3">
      <div>
        <h2 class="font-bold text-base text-white">SnapClip Walkthrough & Authentication Demo</h2>
        <p class="text-xs text-gray-400 mt-0.5">Duration: ~1m 18s • Format: 1080p MP4 with voiceover audio</p>
      </div>
      <div class="flex items-center space-x-3">
        <a 
          href="/demo.mp4" 
          download="snapclip_demo.mp4" 
          class="px-3.5 py-2 rounded-xl bg-[#252540] hover:bg-[#2d2d4e] text-xs font-medium text-gray-300 transition-colors flex items-center space-x-1.5"
        >
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Direct MP4</span>
        </a>
        <a 
          href="https://github.com/athukuriharini-cpu/snapclip-app" 
          target="_blank" 
          class="px-3.5 py-2 rounded-xl bg-[#252540] hover:bg-[#2d2d4e] text-xs font-medium text-gray-300 transition-colors flex items-center space-x-1.5"
        >
          <i data-lucide="github" class="w-3.5 h-3.5"></i>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </div>

  <footer class="mt-8 text-center text-xs text-gray-500">
    <p>© 2026 SnapClip App • Powered by Firebase Hosting Global CDN</p>
  </footer>

  <script>lucide.createIcons();</script>
</body>
</html>
